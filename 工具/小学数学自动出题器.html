<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学数学自动出题器</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f8f9fa; color: #212529; font: 16px/1.5 system-ui, sans-serif; }
        .container { max-width: 1140px; margin: 24px auto; padding: 0 12px; }
        .settings-area, .result-area { background: white; padding: 20px; box-shadow: 0 1px 9px #0002; }
        .settings-area { border-radius: 10px; }
        .nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 0 0 8px; list-style: none; border-bottom: 1px solid #ddd; }
        button { font: inherit; cursor: pointer; }
        .nav-link { padding: 6px 12px; color: #125ba2; background: transparent; border: 1px solid transparent; border-radius: 5px; }
        .nav-link.active { color: #182e42; background: #e8f2fd; border-color: #b8d2ef; }
        .tab-pane:not(.active), [hidden] { display: none !important; }
        h5 { margin: 10px 0 4px; font-size: 1rem; }
        .form-check { padding: 2px 0; }
        .form-check label, .form-check input { cursor: pointer; }
        .text-center { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
        .btn { border: 0; border-radius: 5px; padding: 7px 13px; color: white; }
        .btn-primary { background: #1764b1; }
        .btn-success { background: #167047; }
        .btn-info { background: #166779; }
        .btn:disabled { opacity: .5; cursor: default; }
        .result-area { width: 100%; max-width: 210mm; padding: clamp(12px, 4vw, 10mm); margin: auto; }
        #questionList { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 14px; }
        .result-title { grid-column: 1 / -1; text-align: center; font-size: 1.25rem; margin: 0 0 8px; overflow-wrap: anywhere; }
        .question-item { display: flex; align-items: baseline; gap: .5em; font-size: 15px; }
        .question-number { color: #59636d; }
        .question-text { min-width: 0; overflow-wrap: anywhere; }
        .fraction { display: inline-block; text-align: center; vertical-align: middle; margin: 0 .12em; line-height: 1.15; }
        .fraction > span { display: block; }
        .numerator { border-bottom: 1px solid currentColor; }
        .answer { color: #365777; }
        .footer-signature { margin: 30px 0; text-align: center; color: #606872; font-size: .9rem; }
        @media (max-width: 720px) { #questionList { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 480px) { #questionList { grid-template-columns: 1fr; } .container { margin: 12px auto; } }
        #paperNote { max-width: 210mm; margin: 0 auto 10px; color: #435265; }
        @page { size: A4; margin: 10mm; }
        @media print {
            body { background: white; }
            .container:first-child, .footer-signature, #paperNote { display: none; }
            .container, .result-area { margin: 0; padding: 0; max-width: none; box-shadow: none; }
            #questionList { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3mm; }
            .question-item { font-size: 10pt; break-inside: avoid; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateButton = document.getElementById('generateQuestions');
            const saveButton = document.getElementById('saveAsImage');
            const toggleAnswersButton = document.getElementById('toggleAnswers');
            const questionList = document.getElementById('questionList');
            const gradeTabs = document.querySelectorAll('#gradeTabs .nav-link');
            let answersVisible = false;

            generateButton.addEventListener('click', generateQuestions);
            saveButton.addEventListener('click', saveAsImage);
            toggleAnswersButton.addEventListener('click', toggleAnswers);

            const paper = document.querySelector('.result-area');
            const paperNote = document.getElementById('paperNote');
            gradeTabs.forEach(tab => {
                tab.setAttribute('aria-selected', tab.classList.contains('active'));
                tab.tabIndex = tab.classList.contains('active') ? 0 : -1;
                tab.addEventListener('keydown', event => {
                    const tabs = Array.from(gradeTabs);
                    const index = tabs.indexOf(tab);
                    const next = {
                        ArrowRight: (index + 1) % tabs.length,
                        ArrowLeft: (index + tabs.length - 1) % tabs.length,
                        Home: 0,
                        End: tabs.length - 1
                    }[event.key];
                    if (next === undefined) return;
                    event.preventDefault();
                    tabs[next].focus();
                    tabs[next].click();
                });
                tab.addEventListener('click', () => {
                    if (tab.classList.contains('active')) return;
                    gradeTabs.forEach(item => {
                        const active = item === tab;
                        item.classList.toggle('active', active);
                        item.setAttribute('aria-selected', active);
                        item.tabIndex = active ? 0 : -1;
                        document.querySelector(item.dataset.target).classList.toggle('active', active);
                    });
                    document.querySelectorAll('.form-check-input:checked').forEach(input => { input.checked = false; });
                    questionList.textContent = '';
                    paper.hidden = true;
                    paperNote.hidden = true;
                    saveButton.disabled = true;
                    toggleAnswersButton.hidden = true;
                });
            });

            function generateQuestions() {
                const selected = getSelectedOptions();
                if (!selected.length) {
                    alert('请至少选择一个题型');
                    return;
                }
                const questions = generateUniqueQuestions(selected, 50);
                const title = document.createElement('h3');
                title.className = 'result-title';
                title.textContent = selected.map(option => option.label).join('、') + ' · ' + questions.length + ' 题';
                questionList.textContent = '';
                questionList.appendChild(title);
                questions.forEach((item, index) => questionList.appendChild(createQuestionElement(item, index + 1)));
                paper.hidden = false;
                paperNote.hidden = questions.length >= 50;
                paperNote.textContent = paperNote.hidden ? '' : `本卷共 ${questions.length} 道不重复题；可多选题型组成 50 题。`;
                saveButton.disabled = false;
                answersVisible = false;
                toggleAnswersButton.hidden = false;
                toggleAnswersButton.textContent = '显示答案';
            }

            function getSelectedOptions() {
                const checkboxes = document.querySelectorAll('.tab-pane.active .form-check-input:checked');
                return Array.from(checkboxes).map(checkbox => ({
                    id: checkbox.id,
                    label: checkbox.nextElementSibling.textContent.split('(')[0].trim()
                }));
            }

            function generateUniqueQuestions(options, count) {
                if (options.length === 1 && pairPools.has(options[0].id)) {
                    const pool = [...pairPools.get(options[0].id)];
                    for (let i = pool.length - 1; i > 0; i--) {
                        const j = integer(0, i);
                        [pool[i], pool[j]] = [pool[j], pool[i]];
                    }
                    return pool.slice(0, count);
                }
                const questions = new Map();
                let zeroAnswerCount = 0;
                for (let i = 0; questions.size < count && i < count * 80; i++) {
                    const item = generateQuestion(options[integer(0, options.length - 1)]);
                    if (questions.has(item.question) || (item.answer === '0' && zeroAnswerCount >= 1)) continue;
                    questions.set(item.question, item);
                    if (item.answer === '0') zeroAnswerCount++;
                }
                return Array.from(questions.values());
            }

            function integer(min, max) {
                return min + Math.floor(Math.random() * (max - min + 1));
            }

            function pairPool(subtract, step, carryOnly = false) {
                const pool = [];
                for (let a = 1; a <= 10; a++) {
                    for (let b = 1; b <= 9; b++) {
                        const value = subtract ? a - b : a + b;
                        if (carryOnly) {
                            if (a > 9 || value < 10) continue;
                        } else if (value <= 0 || value > 10) {
                            continue;
                        }
                        pool.push({
                            question: (a * step) + (subtract ? ' - ' : ' + ') + (b * step) + ' = ',
                            answer: String(value * step)
                        });
                    }
                }
                return pool;
            }

            // 穷举这些小题库，题数等于可用的不重复算式数，无须靠补零凑满 50 题。
            const pairPools = new Map([
                ['preschool-add', pairPool(false, 1)],
                ['preschool-sub', pairPool(true, 1)],
                ['grade1-up-20carry', pairPool(false, 1, true)],
                ['grade1-down-add10', pairPool(false, 10)],
                ['grade1-down-sub10', pairPool(true, 10)]
            ]);

            function generateQuestion(option) {
                const pool = pairPools.get(option.id);
                const wholeTens = ['grade1-down-add10', 'grade1-down-sub10', 'grade1-down-mix10'].includes(option.id);
                let item;
                // 保留普通数位中的 0，但降低其权重；整十运算保留原分布。
                for (let attempt = 0; attempt < 5; attempt++) {
                    item = pool ? pool[integer(0, pool.length - 1)] : generateCandidate(option);
                    if (wholeTens || !(item.question + item.answer).includes('0')) break;
                }
                return item;
            }

            function formatAnswer(answer) {
                // 小数练习的输入按十分位或百分位构造，仅消除浮点运算的尾差。
                return String(Number(answer.toFixed(6)));
            }

            function generateCandidate(option) {
                let a, b, c, d, e, f, question, answer;
                let result = { question: "Error", answer: "N/A" };
                switch (option.id) {
                    // 学龄前
                    case 'preschool-mix':
                    case 'grade1-up-mix':
                        a = integer(1, 9);
                        b = integer(1, 10 - a);
                        c = integer(1, a + b - 1);
                        return { question: `${a} + ${b} - ${c} = `, answer: String(a + b - c) };
                    case 'grade1-up-add':
                        a = integer(1, 8);
                        b = integer(1, 9 - a);
                        c = integer(1, 10 - a - b);
                        return { question: `${a} + ${b} + ${c} = `, answer: String(a + b + c) };
                    case 'grade1-up-sub':
                        a = integer(4, 10);
                        b = integer(1, a - 2);
                        c = integer(1, a - b - 1);
                        return { question: `${a} - ${b} - ${c} = `, answer: String(a - b - c) };
                    case 'grade1-up-11to20':
                        a = integer(11, 19);
                        b = integer(1, 20 - a);
                        if (Math.random() < 0.5) return { question: `${a} + ${b} = `, answer: String(a + b) };
                        return { question: `${a + b} - ${b} = `, answer: String(a) };
                    case 'grade1-down-mix10':
                        a = (Math.floor(Math.random() * 5) + 1) * 10;
                        b = (Math.floor(Math.random() * 5) + 1) * 10;
                        c = (Math.floor(Math.random() * ((a+b)/10 -1 )) + 1) * 10;
                         if (a+b-c <0) {
                            a=50;b=30;c=20;
                        }
                        question = `${a} + ${b} - ${c} = `;
                        answer = a + b - c;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade1-down-2d1d':
                        a = Math.floor(Math.random() * 90) + 10;
                        b = Math.floor(Math.random() * 9) + 1;
                        question = `${a} + ${b} = `;
                        answer = a + b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade1-down-2d1dsub':
                        a = Math.floor(Math.random() * 90) + 10;
                        b = Math.floor(Math.random() * (Math.min(9, a % 10 === 0 ? 9 : a % 10))) + 1;
                         if (a-b <0) {a = 23; b=5;}
                        question = `${a} - ${b} = `;
                        answer = a - b;
                        result = { question, answer: formatAnswer(answer) };
                        break;

                    // 二年级
                    case 'grade2-up-add100':
                        a = Math.floor(Math.random() * 99) + 1;
                        b = Math.floor(Math.random() * (100 - a)) + 1;
                        question = `${a} + ${b} = `;
                        answer = a + b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-up-sub100':
                        a = Math.floor(Math.random() * 99) + 2;
                        b = Math.floor(Math.random() * (a-1)) + 1;
                        question = `${a} - ${b} = `;
                        answer = a - b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-up-mix100':
                        return generateCandidate({ id: Math.random() < 0.5 ? 'grade2-up-add100' : 'grade2-up-sub100' });
                    case 'grade2-up-add100chain':
                        a = Math.floor(Math.random() * 30) + 1;
                        b = Math.floor(Math.random() * 30) + 1;
                        c = Math.floor(Math.random() * (100 - a - b > 0 ? 100 - a - b : 1)) + 1;
                        if (a+b+c > 100) {a=20;b=30;c=40;}
                        question = `${a} + ${b} + ${c} = `;
                        answer = a + b + c;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-up-sub100chain':
                        a = Math.floor(Math.random() * 40) + 60;
                        b = Math.floor(Math.random() * 30) + 1;
                        c = Math.floor(Math.random() * (a-b > 0 ? a-b-1 : 1) ) +1;
                        if (a-b-c < 0) {a=90;b=30;c=20;}
                        question = `${a} - ${b} - ${c} = `;
                        answer = a - b - c;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-up-mix100chain':
                        a = Math.floor(Math.random() * 50) + 1;
                        b = Math.floor(Math.random() * 50) + 1;
                        c = Math.floor(Math.random() * (a+b > 1 ? a+b-1 : 1)) +1;
                         if (a+b-c <0) {a=50;b=30;c=70; if (Math.random()<0.5) c=20;}
                        question = `${a} + ${b} - ${c} = `;
                        answer = a + b - c;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-up-mul':
                        a = Math.floor(Math.random() * 9) + 1;
                        b = Math.floor(Math.random() * 9) + 1;
                        question = `${a} × ${b} = `;
                        answer = a * b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-up-muladd':
                        a = Math.floor(Math.random() * 9) + 1;
                        b = Math.floor(Math.random() * 9) + 1;
                        c = Math.floor(Math.random() * 10) + 1;
                        if (Math.random() < 0.5) {
                            question = `${a} × ${b} + ${c} = `;
                            answer = a * b + c;
                        } else {
                            c = Math.floor(Math.random() * (a * b > 0 ? a*b-1: 1)) +1;
                            if (a*b-c <0) {a=3;b=4;c=5;}
                            question = `${a} × ${b} - ${c} = `;
                            answer = a * b - c;
                        }
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-down-div':
                        b = Math.floor(Math.random() * 9) + 1;
                        answer = Math.floor(Math.random() * 9) + 1;
                        a = b * answer;
                        question = `${a} ÷ ${b} = `;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade2-down-muldiv':
                        a = integer(2, 9);
                        b = integer(2, 9);
                        const divisors = [2, 3, 4, 5, 6, 7, 8, 9].filter(n => (a * b) % n === 0);
                        c = divisors[integer(0, divisors.length - 1)];
                        return { question: `${a} × ${b} ÷ ${c} = `, answer: String(a * b / c) };
                    case 'grade3-up-add2d':
                        a = Math.floor(Math.random() * 90) + 10;
                        b = Math.floor(Math.random() * 90) + 10;
                        question = `${a} + ${b} = `;
                        answer = a + b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade3-up-sub2d':
                        a = integer(11, 99);
                        b = integer(10, a - 1);
                        return { question: `${a} - ${b} = `, answer: String(a - b) };
                    case 'grade3-down-div2d1d':
                    case 'grade3-down-div3d1d': {
                        const twoDigits = option.id === 'grade3-down-div2d1d';
                        b = integer(2, 9);
                        answer = integer(Math.ceil((twoDigits ? 10 : 100) / b), Math.floor((twoDigits ? 99 : 999) / b));
                        return { question: `${b * answer} ÷ ${b} = `, answer: String(answer) };
                    }
                    case 'grade3-down-mul2d1d':
                        a = Math.floor(Math.random() * 90) + 10;
                        b = Math.floor(Math.random() * 9) + 1;
                        question = `${a} × ${b} = `;
                        answer = a * b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade3-down-mul2d2d':
                        a = Math.floor(Math.random() * 90) + 10;
                        b = Math.floor(Math.random() * (a > 50 ? 20: (a > 20 ? 50 : 90) ) ) + 10;
                        if (b>99) b= Math.floor(Math.random()*80)+10;
                        question = `${a} × ${b} = `;
                        answer = a * b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade3-down-mul3d':
                        a = integer(11, 39);
                        b = integer(11, 29);
                        c = integer(11, 19);
                        return { question: `${a} × ${b} × ${c} = `, answer: String(a * b * c) };
                    case 'grade3-down-div3d':
                        b = integer(2, 6);
                        c = integer(2, 6);
                        answer = integer(1, Math.floor(99 / (b * c)));
                        return { question: `${b * c * answer} ÷ ${b} ÷ ${c} = `, answer: String(answer) };
                    case 'grade4-up-mul3d2d':
                        a = Math.floor(Math.random() * 900) + 100;
                        b = Math.floor(Math.random() * 90) + 10;
                        question = `${a} × ${b} = `;
                        answer = a * b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade4-up-div2d':
                        b = integer(11, 99);
                        answer = integer(Math.ceil(100 / b), Math.floor(9999 / b));
                        return { question: `${answer * b} ÷ ${b} = `, answer: String(answer) };
                    case 'grade4-down-decadd':
                        a = integer(1, 199) / 10;
                        b = integer(1, 199) / 10;
                        question = `${a.toFixed(1)} + ${b.toFixed(1)} = `;
                        answer = a + b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade4-down-decsub':
                        a = parseFloat((Math.random() * 20 + 5).toFixed(1));
                        b = integer(1, Math.round(a * 10) - 1) / 10;
                        question = `${a.toFixed(1)} - ${b.toFixed(1)} = `;
                        answer = a - b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade4-down-decmix':
                        a = parseFloat((Math.random() * 10 + 1).toFixed(1));
                        b = parseFloat((Math.random() * 10 + 1).toFixed(1));
                        c = integer(1, Math.round((a + b) * 10) - 1) / 10;
                        if (a+b-c <0) {a = 5.5; b=4.5; c=3.2;}
                        question = `${a.toFixed(1)} + ${b.toFixed(1)} - ${c.toFixed(1)} = `;
                        answer = a + b - c;
                        result = { question, answer: formatAnswer(answer) };
                        break;

                    // 五年级
                    case 'grade5-up-decmulint':
                        a = parseFloat((Math.random() * 10 + 0.1).toFixed(Math.random() < 0.5 ? 1 : 2));
                        b = Math.floor(Math.random() * 9) + 2;
                        question = `${a} × ${b} = `;
                        answer = a * b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade5-up-decmuldec':
                        a = parseFloat((Math.random() * 10 + 0.1).toFixed(1));
                        b = parseFloat((Math.random() * 5 + 0.1).toFixed(1));
                        question = `${a} × ${b} = `;
                        answer = a * b;
                        result = { question, answer: formatAnswer(answer) };
                        break;
                    case 'grade5-up-decdivint':
                        b = integer(2, 9);
                        c = integer(1, 499); // 商的百分数单位，倒推被除数。
                        return { question: `${b * c / 100} ÷ ${b} = `, answer: String(c / 100) };
                    case 'grade5-up-intdivdec':
                        const divisorsInTenths = [2, 3, 4, 5, 6, 8, 9, 12, 14, 15, 16, 18, 24, 25, 32, 35, 45];
                        b = divisorsInTenths[integer(0, divisorsInTenths.length - 1)];
                        a = (b / gcd(b, 1000)) * integer(1, 12);
                        return { question: `${a} ÷ ${b / 10} = `, answer: String((1000 * a / b) / 100) };
                    case 'grade5-down-intdivfrac':
                        b = integer(2, 12);
                        a = integer(1, b - 1) + b * integer(0, 2);
                        return { question: `${a} ÷ ${b} = `, answer: formatMixedFraction(a, b) };
                    case 'grade5-down-fracadd':
                    case 'grade5-down-fracsub': {
                        [a, b] = generateProperFraction();
                        [c, d] = generateProperFraction();
                        const subtract = option.id === 'grade5-down-fracsub';
                        if (subtract && a * d < c * b) [a, b, c, d] = [c, d, a, b];
                        const op = subtract ? '-' : '+';
                        return {
                            question: `${fraction(a, b)} ${op} ${fraction(c, d)} = `,
                            answer: formatMixedFraction(subtract ? a * d - c * b : a * d + c * b, b * d)
                        };
                    }
                    case 'grade5-down-fracmix':
                        [a, b] = generateProperFraction();
                        [c, d] = generateProperFraction();
                        [e, f] = generateProperFraction();
                        if ((a * d + c * b) * f < e * b * d) [a, b, e, f] = [e, f, a, b];
                        return {
                            question: `${fraction(a, b)} + ${fraction(c, d)} - ${fraction(e, f)} = `,
                            answer: formatMixedFraction((a * d + c * b) * f - e * b * d, b * d * f)
                        };
                    case 'grade6-up-fracmulint':
                    case 'grade6-up-fracdivint':
                    case 'grade6-up-fracmulfrac':
                    case 'grade6-up-fracdivfrac':
                    case 'grade6-up-fracmuldec':
                    case 'grade6-up-fracdivdec': {
                        [a, b] = generateProperFraction();
                        let operand;
                        if (option.id.endsWith('int')) {
                            c = integer(2, 9);
                            d = 1;
                            operand = String(c);
                        } else if (option.id.endsWith('dec')) {
                            c = integer(5, 49);
                            d = 10;
                            operand = (c / d).toFixed(1);
                        } else {
                            [c, d] = generateProperFraction();
                            operand = fraction(c, d);
                        }
                        const divide = option.id.includes('fracdiv');
                        return {
                            question: `${fraction(a, b)} ${divide ? '÷' : '×'} ${operand} = `,
                            answer: divide ? formatMixedFraction(a * d, b * c) : formatMixedFraction(a * c, b * d)
                        };
                    }
                    case 'grade6-up-fracmixop':
                        [a, b] = generateProperFraction();
                        [c, d] = generateProperFraction();
                        [e, f] = generateProperFraction();
                        return {
                            question: `${fraction(a, b)} × ${fraction(c, d)} ÷ ${fraction(e, f)} = `,
                            answer: formatMixedFraction(a * c * f, b * d * e)
                        };
                    default:
                        console.warn("Unknown option ID:", option.id);
                        result = { question: "未知题型", answer: "N/A" };
                }
                return result;
            }

            function generateProperFraction() {
                const denominators = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 16, 20];
                let den = denominators[Math.floor(Math.random() * denominators.length)];
                let num = Math.floor(Math.random() * (den - 1)) + 1;
                const commonDivisor = gcd(num, den);
                num /= commonDivisor;
                den /= commonDivisor;
                return [num, den];
            }

            function gcd(a, b) {
                if (b === 0) {
                    return a;
                }
                return gcd(b, a % b);
            }

            function fraction(num, den) {
                return `<span class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}</span></span>`;
            }

            function formatMixedFraction(num, den) {
                const factor = gcd(num, den);
                num /= factor;
                den /= factor;
                const whole = Math.floor(num / den);
                const remainder = num % den;
                if (remainder === 0) return String(whole);
                return (whole ? whole + ' ' : '') + fraction(remainder, den);
            }

            function createQuestionElement(questionObj, index) {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `
                    <span class="question-number">${index}.</span>
                    <span class="question-text">${questionObj.question}<span class="answer" style="display: none;">${questionObj.answer}</span></span>
                `;
                return div;
            }

            function toggleAnswers() {
                answersVisible = !answersVisible;
                const answers = document.querySelectorAll('.answer');
                answers.forEach(answer => {
                    answer.style.display = answersVisible ? 'inline' : 'none';
                });
                toggleAnswersButton.textContent = answersVisible ? '隐藏答案' : '显示答案';
            }

            // 读取当前卷面中的文字和上下分数，学生卷与答案卷共用同一份题目。
            function mathRuns(node, isAnswer = false) {
                if (node.nodeType === Node.TEXT_NODE) return [{ text: node.textContent, isAnswer }];
                if (node.classList.contains('fraction')) {
                    return [{ num: node.firstElementChild.textContent, den: node.lastElementChild.textContent, isAnswer }];
                }
                const answer = node.classList.contains('answer');
                if (answer && !answersVisible) return [];
                const runs = [];
                node.childNodes.forEach(child => runs.push(...mathRuns(child, isAnswer || answer)));
                return runs;
            }

            function drawExpression(ctx, node, x, y, maxWidth) {
                const runs = mathRuns(node);
                const widths = runs.map(run => {
                    if (run.text !== undefined) return ctx.measureText(run.text).width;
                    return Math.max(ctx.measureText(run.num).width, ctx.measureText(run.den).width) + 6;
                });
                const width = widths.reduce((sum, value) => sum + value, 0);
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(Math.min(1, maxWidth / width), 1);
                let left = 0;
                runs.forEach((run, index) => {
                    ctx.fillStyle = run.isAnswer ? '#365777' : '#212529';
                    const w = widths[index];
                    if (run.text !== undefined) {
                        ctx.textAlign = 'left';
                        ctx.fillText(run.text, left, 0);
                    } else {
                        ctx.textAlign = 'center';
                        ctx.fillText(run.num, left + w / 2, -8);
                        ctx.fillRect(left + 2, 0, w - 4, 1);
                        ctx.fillText(run.den, left + w / 2, 9);
                    }
                    left += w;
                });
                ctx.restore();
            }

            function saveAsImage() {
                const title = questionList.querySelector('.result-title');
                if (!title) return;
                const width = 794, height = 1123, margin = 32;
                const canvas = document.createElement('canvas');
                canvas.width = width * 2;
                canvas.height = height * 2;
                const ctx = canvas.getContext('2d');
                ctx.scale(2, 2);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#212529';
                ctx.font = 'bold 21px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let line = '', y = margin + 12;
                for (const character of title.textContent) {
                    if (ctx.measureText(line + character).width > width - 2 * margin) {
                        ctx.fillText(line, width / 2, y);
                        line = '';
                        y += 28;
                    }
                    line += character;
                }
                ctx.fillText(line, width / 2, y);

                const items = questionList.querySelectorAll('.question-item');
                const top = y + 38;
                const columnWidth = (width - margin * 2) / 3;
                const rowHeight = (height - margin - top) / Math.ceil(items.length / 3);
                ctx.font = '14px system-ui, sans-serif';
                ctx.textAlign = 'left';
                items.forEach((item, index) => {
                    const x = margin + (index % 3) * columnWidth;
                    const baseline = top + (Math.floor(index / 3) + 0.5) * rowHeight;
                    ctx.fillStyle = '#59636d';
                    ctx.fillText((index + 1) + '.', x, baseline);
                    drawExpression(ctx, item.querySelector('.question-text'), x + 26, baseline, columnWidth - 36);
                });
                const link = document.createElement('a');
                link.download = title.textContent.slice(0, 64) + (answersVisible ? '-答案' : '-练习') + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }

        });
    </script>
</body>
